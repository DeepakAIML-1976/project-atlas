kind = "mobile"
previewPath = "/atlas-mobile/"
title = "Atlas Mobile"
description = "A companion to Project Atlas for personal twin calibration, consented source review, meeting actions, decisions, and workspace memory on the go. It uses the same empty-by-default workspace and governance controls as the website."
version = "1.0.0"
id = "artifacts/atlas-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/atlas-mobile/" ]
localPort = 20569

[services.development]
run = "pnpm --filter @workspace/atlas-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/atlas-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/atlas-mobile", "run", "serve" ]

[services.env]
PORT = "20569"
BASE_PATH = "/atlas-mobile/"
