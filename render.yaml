services:
  - type: web
    name: digital-twin-suite
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: AUTO_START_LIVE_RESPONDER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MS_GRAPH_CLIENT_ID
        sync: false
      - key: MS_GRAPH_TENANT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_SECRET
        sync: false
      - key: MS_GRAPH_USER_EMAIL
        sync: false
      - key: MS_GRAPH_REFRESH_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
